---
- name: Base configuration for all hosts
  hosts: all
  become: true
  roles:
    - base

- name: Docker host configuration
  hosts: docker_hosts
  become: true
  roles:
    - docker_host

- name: Wazuh-agent på alla övervakade hostar
  hosts: all
  become: true
  tags: wazuh_agent
  roles:
    - wazuh_agent
